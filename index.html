<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ward Callings Board</title>
<style>
:root{
  --board:#efe9dc; --board-line:#e2dacb; --card:#fbf8f2; --ink:#2b2722; --muted:#76695a; --rule:#d9cfbd;
  --accent:#2f5d50; --accent-ink:#fff;
  --t-new:#d8ecd9; --t-new-b:#7bb383;
  --t-mid:#fff;    --t-mid-b:#cbbfa9;
  --t-long:#fbe7c4; --t-long-b:#d9a54a;
  --t-vlong:#f6d2c4; --t-vlong-b:#c9745a;
  --vacant:#a8998a;
  --plan:#3b6fb6; --plan-bg:#e3ecf9; --release:#b04a3a;
  --shadow:0 1px 0 rgba(0,0,0,.06),0 2px 4px rgba(60,40,10,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#1f1d1a; --board-line:#2a2723; --card:#282521; --ink:#ece6dc; --muted:#a59a8b; --rule:#3a352f;
  --accent:#7fb8a6; --accent-ink:#11201b;
  --t-new:#24402a; --t-new-b:#5c9a66; --t-mid:#34302b; --t-mid-b:#4c463e;
  --t-long:#4a3a1c; --t-long-b:#b88a36; --t-vlong:#4d2b22; --t-vlong-b:#b0634b;
  --vacant:#7d7366; --plan:#86aee6; --plan-bg:#22304a; --release:#e08a7a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --board:#1f1d1a; --board-line:#2a2723; --card:#282521; --ink:#ece6dc; --muted:#a59a8b; --rule:#3a352f;
  --accent:#7fb8a6; --accent-ink:#11201b;
  --t-new:#24402a; --t-new-b:#5c9a66; --t-mid:#34302b; --t-mid-b:#4c463e;
  --t-long:#4a3a1c; --t-long-b:#b88a36; --t-vlong:#4d2b22; --t-vlong-b:#b0634b;
  --vacant:#7d7366; --plan:#86aee6; --plan-bg:#22304a; --release:#e08a7a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--board);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background-image:radial-gradient(var(--board-line) 1px,transparent 1px);background-size:18px 18px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--board) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:12px 20px 10px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font:600 20px/1.2 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:12.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.stat b{color:var(--ink);font-size:15px;margin-right:4px;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:6px 9px}
input[type=search]{min-width:220px;flex:1 1 220px;max-width:340px}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid}
main{padding:16px 20px 60px}
.board{columns:330px;column-gap:16px}
.org{break-inside:avoid;background:var(--card);border:1px solid var(--rule);border-radius:12px;margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.org>h2{margin:0;padding:10px 14px;font:600 15px/1.2 Georgia,serif;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
.org>h2 .cnt{font:12px -apple-system,system-ui,sans-serif;color:var(--muted)}
.org.collapsed .groups{display:none}
.groups{padding:6px 10px 10px}
.group{margin-top:8px}
.group h3{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:5px 0;border-top:1px dashed var(--rule)}
.group .slot:first-of-type{border-top:0}
.slot .ct{font-size:11.5px;color:var(--muted)}
.mag{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 9px;border-radius:7px;border:1px solid var(--t-mid-b);background:var(--t-mid);box-shadow:var(--shadow);cursor:pointer;min-height:34px}
.mag .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mag .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.mag .meta b{color:var(--ink);font-weight:600}
.mag.new{background:var(--t-new);border-color:var(--t-new-b)}
.mag.long{background:var(--t-long);border-color:var(--t-long-b)}
.mag.vlong{background:var(--t-vlong);border-color:var(--t-vlong-b)}
.mag .multi{display:inline-block;font-size:10.5px;font-weight:600;border:1px solid var(--rule);border-radius:9px;padding:0 5px;margin-left:5px;color:var(--muted);background:var(--card)}
.mag.vac{background:transparent;border:1.5px dashed var(--vacant);box-shadow:none;color:var(--vacant);cursor:default;font-style:italic}
.dim{opacity:.18}
.hl{outline:2.5px solid var(--accent);outline-offset:1px}
.hidden{display:none!important}
/* panel */
.panel{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);border-left:1px solid var(--rule);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:40;padding:18px;overflow:auto;transform:translateX(105%);transition:transform .18s ease}
.panel.open{transform:none}
.panel h3{margin:0 0 2px;font:600 19px Georgia,serif}
.panel .x{float:right}
.panel ul{padding-left:18px;margin:8px 0 14px}
.panel li{margin:6px 0}
.panel label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
/* list view */
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
@media (max-width:640px){header{position:static}header,main{padding-left:16px;padding-right:16px}input[type=search]{min-width:0}}
@media print{
  header{position:static;backdrop-filter:none}.controls,.panel,.legend button{display:none!important}
  body{background:#fff}.org{box-shadow:none}.board{columns:3 230px}
}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lock form{background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px;width:min(360px,100%)}
.lock h1{margin:0 0 6px}
.lock p{margin:0 0 16px;color:var(--muted);font-size:13px}
.lock input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--board);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.lock label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.lock button{width:100%;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:10px;font-size:15px}
.lock .err{color:var(--release);font-size:13px;min-height:18px;margin:-4px 0 8px}
body.locked header,body.locked main{display:none}
body:not(.locked) .lock{display:none}
</style>
</head>
<body class="locked">
<div class="lock" id="lock">
  <form id="lockForm" autocomplete="on">
    <h1>Ward Callings Board</h1>
    <p>Meridian 5th Ward bishopric. Enter the password to view.</p>
    <input type="text" name="username" value="ward-callings-board" autocomplete="username" hidden>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password" autofocus>
    <div class="err" id="pwErr"></div>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button type="submit" id="unlockBtn">Open board</button>
  </form>
</div>
<header>
  <div class="top">
    <h1 id="title">Ward Callings Board</h1>
    <span class="sub" id="asof"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search a name or calling…" aria-label="Search">
    <select id="tenure" aria-label="Highlight by time in calling">
      <option value="">Highlight: none</option>
      <option value="new">Sustained in last 6 months</option>
      <option value="long">Serving 2+ years</option>
      <option value="vlong">Serving 3+ years</option>
      <option value="vac">Vacant callings</option>
      <option value="multi">People with 2+ callings</option>
    </select>
    <button id="viewBoard" class="on">Board</button>
    <button id="viewList">List</button>
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse all</button>
    <button id="printBtn">Print</button>
    <button id="themeBtn" title="Toggle light/dark">Light / Dark</button>
  </div>
  <div class="legend">
    <span><i class="sw" style="background:var(--t-new);border-color:var(--t-new-b)"></i>Under 6 months</span>
    <span><i class="sw" style="background:var(--t-mid);border-color:var(--t-mid-b)"></i>6 mo – 2 yrs</span>
    <span><i class="sw" style="background:var(--t-long);border-color:var(--t-long-b)"></i>2 – 3 yrs</span>
    <span><i class="sw" style="background:var(--t-vlong);border-color:var(--t-vlong-b)"></i>3+ yrs</span>
    <span><i class="sw" style="background:transparent;border:1.5px dashed var(--vacant)"></i>Vacant</span>
    <span>· Click a name for details · Click an organization title to collapse it</span>
  </div>
</header>

<main>
  <div class="board" id="board"></div>
  <div class="tablewrap hidden" id="listWrap">
    <table id="list"><thead><tr>
      <th data-k="name">Name</th><th data-k="calling">Calling</th><th data-k="org">Organization</th><th data-k="date">Sustained</th><th data-k="days">Time in calling</th>
    </tr></thead><tbody></tbody></table>
  </div>
</main>

<aside class="panel" id="panel" aria-label="Details"></aside>

<script>
function startBoard(DATA){
const $=s=>document.querySelector(s);
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const today=new Date(); today.setHours(0,0,0,0);
function parseD(s){if(!s)return null;const m=s.match(/(\d+)\s+(\w{3})\s+(\d{4})/);return m?new Date(+m[3],MON[m[2]],+m[1]):null}
function dur(d){if(!d)return'';let m=(today.getFullYear()-d.getFullYear())*12+today.getMonth()-d.getMonth();if(today.getDate()<d.getDate())m--;if(m<1){const w=Math.max(0,Math.round((today-d)/6048e5));return w+' wk'}const y=Math.floor(m/12),r=m%12;return (y?y+' yr ':'')+(r?r+' mo':'')}
function band(days){if(days==null)return'';if(days<183)return'new';if(days>=1096)return'vlong';if(days>=730)return'long';return''}
function disp(n){if(!n)return'';const i=n.indexOf(',');return i<0?n:(n.slice(i+1).trim()+' '+n.slice(0,i).trim())}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const KEY='wardBoard:'+DATA.ward;

const seen={};
const slots=DATA.rows.map(r=>{const [org,group,calling,name,sus]=r;const base=org+'|'+group+'|'+calling;seen[base]=(seen[base]||0)+1;
  const d=parseD(sus);const days=d?Math.round((today-d)/864e5):null;
  return{id:base+'#'+seen[base],org,group,calling,name,sus,d,days};});
const slotById={};slots.forEach(s=>slotById[s.id]=s);
const byName={};slots.forEach(s=>{if(s.name)(byName[s.name]=byName[s.name]||[]).push(s)});
// the bishopric is listed again as the Aaronic Priesthood presidency; don't double count it
function callingsOf(n){return (byName[n]||[]).filter(s=>s.group!=='Presidency of the Aaronic Priesthood')}

$('#title').textContent=DATA.ward+' — Callings Board';
$('#asof').textContent='LCR data as of '+DATA.updated+' · times in calling are counted to today';

function stats(){
  const filled=slots.filter(s=>s.name&&s.group!=='Presidency of the Aaronic Priesthood');
  const vac=slots.filter(s=>!s.name).length;
  const people=new Set(filled.map(s=>s.name)).size;
  const recent=filled.filter(s=>s.days!=null&&s.days<183).length;
  const long=filled.filter(s=>s.days!=null&&s.days>=1096).length;
  const med=(a=>{a.sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0})(filled.map(s=>s.days).filter(x=>x!=null));
  $('#stats').innerHTML=[
    [filled.length,'callings filled'],[people,'people serving'],[vac,'vacant'],
    [recent,'sustained in last 6 mo'],[long,'serving 3+ yrs'],[dur(new Date(today-med*864e5)),'median time in calling']
  ].map(([v,l])=>`<span class="stat"><b>${esc(v)}</b>${l}</span>`).join('');
}

function magHTML(s){
  if(!s.name)return `<div class="mag vac">Vacant</div>`;
  const cnt=callingsOf(s.name).length;
  return `<div class="mag ${band(s.days)}" data-name="${esc(s.name)}" title="${esc(s.name)} — sustained ${esc(s.sus)}">
    <span class="nm">${esc(disp(s.name))}${cnt>1?`<span class="multi" title="${cnt} callings">×${cnt}</span>`:''}</span>
    <span class="meta"><b>${esc(dur(s.d))}</b><br>${esc(s.sus)}</span></div>`;
}

function renderBoard(){
  const orgs=[];const map={};
  slots.forEach(s=>{if(!map[s.org]){map[s.org]={name:s.org,groups:[],gm:{}};orgs.push(map[s.org])}
    const o=map[s.org];const g=s.group||'';if(!o.gm[g]){o.gm[g]={name:g,slots:[]};o.groups.push(o.gm[g])}o.gm[g].slots.push(s)});
  const collapsed=store(KEY+':collapsed')||{};
  $('#board').innerHTML=orgs.map(o=>{const all=o.groups.flatMap(g=>g.slots);const f=all.filter(s=>s.name).length;
    return `<section class="org${collapsed[o.name]?' collapsed':''}" data-org="${esc(o.name)}"><h2>${esc(o.name)}<span class="cnt">${f} of ${all.length} filled ▾</span></h2><div class="groups">`+
      o.groups.map(g=>`<div class="group">${g.name?`<h3>${esc(g.name)}</h3>`:''}`+
        g.slots.map(s=>`<div class="slot" data-slot="${esc(s.id)}"><span class="ct">${esc(s.calling)}</span>${magHTML(s)}</div>`).join('')+`</div>`).join('')+
      `</div></section>`}).join('');
  applyFilter();stats();
}

function applyFilter(){
  const q=$('#q').value.trim().toLowerCase();const h=$('#tenure').value;
  document.querySelectorAll('.slot').forEach(el=>{
    const s=slotById[el.dataset.slot];
    const txt=(s.calling+' '+s.name+' '+disp(s.name)+' '+s.group).toLowerCase();
    let match=!q||txt.includes(q);
    if(h){let ok=false;
      if(h==='vac')ok=!s.name;
      else if(h==='multi')ok=!!s.name&&callingsOf(s.name).length>1;
      else if(h==='new')ok=s.days!=null&&s.days<183;else if(h==='long')ok=s.days!=null&&s.days>=730;else if(h==='vlong')ok=s.days!=null&&s.days>=1096;
      match=match&&ok;}
    el.classList.toggle('dim',!!(q||h)&&!match);
  });
  document.querySelectorAll('#list tbody tr').forEach(tr=>{tr.classList.toggle('hidden',!!q&&!tr.textContent.toLowerCase().includes(q))});
}

let sortK='days',sortDir=-1;
function renderList(){
  const rows=slots.filter(s=>s.name&&s.group!=='Presidency of the Aaronic Priesthood').map(s=>({name:disp(s.name),last:s.name,calling:s.calling,org:s.org+(s.group?' › '+s.group:''),date:s.sus,days:s.days,d:s.d}));
  rows.sort((a,b)=>{let x,y;if(sortK==='days'||sortK==='date'){x=a.days;y=b.days}else if(sortK==='name'){x=a.last;y=b.last}else{x=a[sortK];y=b[sortK]}return (x>y?1:x<y?-1:0)*sortDir*(sortK==='date'?-1:1)});
  $('#list tbody').innerHTML=rows.map(r=>`<tr data-name="${esc(r.last)}"><td>${esc(r.name)}</td><td>${esc(r.calling)}</td><td>${esc(r.org)}</td><td class="num">${esc(r.date)}</td><td class="num">${esc(dur(r.d))}</td></tr>`).join('');
  applyFilter();
}
document.querySelectorAll('#list th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=k==='days'?-1:1}renderList()});
$('#list').addEventListener('click',e=>{const tr=e.target.closest('tr[data-name]');if(tr)openPerson(tr.dataset.name)});

function openPerson(name){
  const cs=callingsOf(name);
  const h=`<button class="x" id="pClose">✕</button><h3>${esc(disp(name))}</h3><div class="sub">${esc(name)}</div>`+
    `<label>Current callings (LCR)</label><ul>${cs.map(s=>`<li><b>${esc(s.calling)}</b><br><span class="sub">${esc(s.org)}${s.group?' › '+esc(s.group):''}<br>Sustained ${esc(s.sus)} · ${esc(dur(s.d))}</span></li>`).join('')}</ul>`;
  const panel=$('#panel');panel.innerHTML=h;panel.classList.add('open');
  $('#pClose').onclick=()=>panel.classList.remove('open');
}
$('#board').addEventListener('click',e=>{
  const h2=e.target.closest('.org>h2');if(h2){const sec=h2.parentElement;sec.classList.toggle('collapsed');const c=store(KEY+':collapsed')||{};c[sec.dataset.org]=sec.classList.contains('collapsed');store(KEY+':collapsed',c);return}
  const m=e.target.closest('.mag[data-name]');if(m)openPerson(m.dataset.name);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#panel').classList.remove('open')});

$('#q').oninput=applyFilter;$('#tenure').onchange=applyFilter;
$('#viewBoard').onclick=()=>{$('#board').classList.remove('hidden');$('#listWrap').classList.add('hidden');$('#viewBoard').classList.add('on');$('#viewList').classList.remove('on')};
$('#viewList').onclick=()=>{renderList();$('#board').classList.add('hidden');$('#listWrap').classList.remove('hidden');$('#viewList').classList.add('on');$('#viewBoard').classList.remove('on')};
function setAll(collapsed){const c={};document.querySelectorAll('.org').forEach(sec=>{sec.classList.toggle('collapsed',collapsed);c[sec.dataset.org]=collapsed});store(KEY+':collapsed',c);
  if(!$('#board').classList.contains('hidden'))return;$('#viewBoard').click()}
$('#expandAll').onclick=()=>setAll(false);
$('#collapseAll').onclick=()=>setAll(true);
$('#printBtn').onclick=()=>window.print();
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store('wardBoard:theme',r.dataset.theme)};
const th=store('wardBoard:theme');if(th)document.documentElement.dataset.theme=th;

renderBoard();
}

// ---- password gate: the callings data is AES-GCM encrypted; the password unlocks it in the browser ----
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const RK='wardBoard:pw';
  function remembered(){try{return localStorage.getItem(RK)}catch(e){return null}}
  function remember(p){try{p?localStorage.setItem(RK,p):localStorage.removeItem(RK)}catch(e){}}
  async function decrypt(pw){
    const e=PAYLOAD.enc;
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function open(data){document.body.classList.remove('locked');startBoard(data)}
  if(PAYLOAD.data){open(PAYLOAD.data);return}
  const form=document.getElementById('lockForm'),pw=document.getElementById('pw'),err=document.getElementById('pwErr'),btn=document.getElementById('unlockBtn');
  async function tryPw(p,auto){
    btn.disabled=true;btn.textContent='Opening…';err.textContent='';
    try{const d=await decrypt(p);if(document.getElementById('remember').checked||auto)remember(p);open(d)}
    catch(e){if(auto)remember(null);else{err.textContent='That password is not right. Try again.';pw.select()}}
    btn.disabled=false;btn.textContent='Open board';
  }
  form.addEventListener('submit',ev=>{ev.preventDefault();if(pw.value)tryPw(pw.value,false)});
  const saved=remembered();if(saved)tryPw(saved,true);
})();
</script>
